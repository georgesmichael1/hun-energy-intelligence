name: Hungary Energy Update

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes, UTC
  workflow_dispatch:          # manual "Run workflow" entrypoint

permissions:
  contents: write

concurrency:
  group: hun-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      # One orchestrator: token-free feeds always; ENTSO-E daily batch when due.
      # Good data is committed even if a later step fails.
      - name: Run Hungary update
        run: python3 run_scheduled.py

      - name: Commit and push updated files
        run: |
          git config user.name "Hungary Energy Auto-Updater"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A '*.csv' 'status.json' 'physical_flows_status.json'
          if git diff --staged --quiet; then
            echo "No data changes this run."
          else
            git commit -m "chore(data): auto-update $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      # Gate: any dataset not OK fails the run, except STATIC_REFERENCE and SKIPPED
      # (SKIPPED = ENTSO-E secret not configured yet, or daily batch already done).
      - name: Dataset quality gate
        run: |
          python3 - <<'PY'
          import json, sys
          with open("status.json", encoding="utf-8") as f:
              status = json.load(f)
          details = status.get("dataset_details", {})
          if not details:
              print("::error::Dataset state missing")
              sys.exit(1)
          issues = []
          for name, item in details.items():
              state = item.get("state", "")
              if state == "OK":
                  continue
              if state in ("STATIC_REFERENCE", "SKIPPED", "PARTIAL"):
                  print(f"::warning::{name}: {state}: {item.get('detail','')}")
                  continue
              issues.append(f"{name}: {state}: {item.get('detail','')}")
          for issue in issues:
              print(f"::error::{issue}")
          sys.exit(1 if issues else 0)
          PY
